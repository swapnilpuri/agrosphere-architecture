name: Architecture validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - name: Download pinned diagram validator
        run: curl -fsSL https://github.com/plantuml/plantuml/releases/download/v1.2026.9/plantuml.jar -o /tmp/plantuml.jar
      - name: Verify validator checksum
        run: python -c "import hashlib; assert hashlib.sha256(open('/tmp/plantuml.jar','rb').read()).hexdigest() == 'aa4a1d06f8911c4b842beff4828dd955be431692b631a312d04c0e9fab9581de'"
      - run: java -jar /tmp/plantuml.jar -checkonly 'docs/architecture/*.puml' 'diagrams/milestone-3a/*.puml' 'diagrams/milestone-3b/*.puml'
